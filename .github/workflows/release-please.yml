name: Release Please

# Workflow 1 — opens/updates the release PR only. It never tags a release
# (skip-github-release: true). Tagging and publishing live in
# release-publish.yml so the next PR is computed only AFTER the previous
# release is labelled "autorelease: published", which keeps the changelog a
# delta since the last release rather than a re-statement of the whole
# history.
on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-pr
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release-pr:
    name: Release PR
    # Skip the release merge commit (e.g. "chore(main): release 0.3.0"):
    # merging a release PR triggers the publish workflow, which recomputes
    # this PR itself once the previous release is published. Running here too
    # would open a stale PR against not-yet-published state.
    if: "${{ github.event_name != 'push' || !startsWith(github.event.head_commit.message, 'chore(main): release') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release-pr
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only create/update the release PR. Tagging and publishing are
          # handled by release-publish.yml so the next PR's changelog is
          # always the delta since the last published release.
          skip-github-release: true
