name: Acceptance Tests

on:
  workflow_dispatch:
    inputs:
      run_gated_tests:
        description: "Also run the gated tests (quota, container project, system settings, reverse proxy, firewall) — needs real hardware and rewrites live configuration"
        type: boolean
        default: false
  schedule:
    # Every Sunday at 03:00 UTC — low-cost weekly baseline check
    - cron: '0 3 * * 0'

concurrency:
  group: acceptance-tests
  cancel-in-progress: false

permissions:
  contents: read
  issues: write

jobs:
  acceptance:
    name: Virtual DSM Acceptance Tests
    runs-on: ubuntu-latest
    # Boot (up to 45 minutes without KVM) plus the suite's own 45-minute budget.
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Build provider
        run: go build -trimpath -o bin/terraform-provider-synology-dsm .

      # ── Bring up virtual DSM ──────────────────────────────────────
      # The image needs /dev/net/tun and NET_ADMIN to give the guest a network,
      # and /dev/kvm to run at anything other than emulation speed. None of that
      # lives in docker-compose.test.yml, because that file is also used inside
      # the Lima VM, where /dev/kvm does not exist and a missing device would
      # fail `up` outright.
      - name: Start virtual DSM
        run: |
          set -euo pipefail
          FILES="-f docker-compose.test.yml -f docker-compose.ci.yml"
          if [ -e /dev/kvm ]; then
            echo "KVM is available: $(ls -l /dev/kvm)"
            FILES="$FILES -f docker-compose.ci-kvm.yml"
          else
            echo "::warning::/dev/kvm is not present on this runner. Virtual DSM falls back to software emulation, which is roughly an order of magnitude slower to boot."
            echo "DSM_TIMEOUT=2700" >> "$GITHUB_ENV"
          fi
          echo "COMPOSE_FILES=$FILES" >> "$GITHUB_ENV"
          docker compose $FILES up -d
          echo "Container started, waiting for DSM API..."

      - name: Wait for DSM
        run: bash scripts/wait-for-dsm.sh
        env:
          DSM_HOST: http://localhost:5000
          DSM_TIMEOUT: ${{ env.DSM_TIMEOUT || '1800' }}

      # ── Diagnostics ──────────────────────────────────────────────
      # Runs on any failure above or below. Run 32616185796 failed with the wait
      # script's timeout as the only evidence anywhere: the container's own logs
      # were never captured, and the issue it opened could therefore say nothing
      # about why. The tail is also attached to that issue below.
      - name: Collect virtual DSM logs
        if: failure()
        run: |
          docker compose $COMPOSE_FILES ps -a || true
          docker compose $COMPOSE_FILES logs --tail 400 > dsm-logs.txt 2>&1 || true
          tail -n 400 dsm-logs.txt || true

      # ── Sweep leftover test resources ────────────────────────────
      # Only the root package registers sweepers; do NOT use ./...
      - name: Sweep leftover test resources
        run: go test . -sweep=all -timeout 10m
        env:
          TF_ACC: "1"
          SYNOLOGY_DSM_HOST: http://localhost:5000
          SYNOLOGY_DSM_USERNAME: admin
          SYNOLOGY_DSM_PASSWORD: ""

      # ── Run acceptance tests ─────────────────────────────────────
      # Every gate is an environment variable read with os.Getenv in
      # internal/acctest; passing them as `go test -DSM_ACC_...` flags made the
      # test binary exit with "flag provided but not defined" before running a
      # single test. The names below are the ones the code actually looks for.
      - name: Run acceptance tests
        run: TF_ACC=1 go test -v -timeout 45m ./...
        env:
          SYNOLOGY_DSM_HOST: http://localhost:5000
          SYNOLOGY_DSM_USERNAME: admin
          SYNOLOGY_DSM_PASSWORD: ""
          # Gated tests need real hardware, rewrite live service configuration,
          # or can lock the runner out of the NAS. Off unless asked for.
          DSM_ACC_QUOTA: ${{ inputs.run_gated_tests && '1' || '' }}
          DSM_ACC_CONTAINER_PROJECT: ${{ inputs.run_gated_tests && '1' || '' }}
          DSM_ACC_SYSTEM_SETTINGS: ${{ inputs.run_gated_tests && '1' || '' }}
          DSM_ACC_REVERSE_PROXY: ${{ inputs.run_gated_tests && '1' || '' }}
          DSM_ACC_FIREWALL: ${{ inputs.run_gated_tests && '1' || '' }}

      - name: Create issue on failure
        if: failure()
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v7
        with:
          script: |
            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            // Check for an existing open issue to avoid duplicates
            const { data: issues } = await github.rest.issues.listForRepo({
              ...context.repo,
              state: 'open',
              labels: ['acceptance'],
              per_page: 1,
            });
            // The container's own log is the difference between "a test failed"
            // and "DSM never booted" — the two failures look identical from the
            // outside, and the second one leaves no trace in the Go output at all.
            const fs = require('fs');
            let logTail = '';
            try {
              const lines = fs.readFileSync('dsm-logs.txt', 'utf8').trimEnd().split('\n');
              logTail = lines.slice(-60).join('\n');
            } catch {
              logTail = '(no container log was captured)';
            }
            const body = [
              '## Acceptance test failure',
              '',
              `**Run:** ${runUrl}`,
              '',
              'The acceptance test suite failed against virtual DSM.',
              '',
              '## Last lines of the virtual DSM container log',
              '',
              '```',
              logTail,
              '```',
              '',
              '## Next steps',
              '1. Read the log above: a wait-for-DSM timeout with no QEMU output is a container problem, not a test failure',
              '2. Download the workflow logs for the Go output',
              '3. Reproduce locally: `task test-env-up && task test-acc`',
              '4. Re-run this workflow to confirm the fix',
            ].join('\n');
            if (issues.length > 0) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issues[0].number,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title: `Acceptance tests failed (${new Date().toISOString().slice(0, 10)})`,
                body,
                labels: ['acceptance', 'bug'],
              });
            }

      - name: Tear down virtual DSM
        if: always()
        run: docker compose ${COMPOSE_FILES:--f docker-compose.test.yml} down -v
