name: Release Publish

# Workflow 2 — tags a release and publishes verified artifacts. Triggered when a
# release PR carrying the "autorelease: pending" label is merged. It creates the tag
# and draft release (skip-github-pull-request: true, so it never opens the next PR),
# builds/signs/verifies the artifacts, flips the PR label to "autorelease:
# published", then re-runs the release-please workflow so the next release PR is
# computed against the now-published state — i.e. with a delta-only changelog.
#
# The label to gate on is "pending", not "tagged": Release Please labels a release
# PR "autorelease: pending" when it opens it and only relabels it "autorelease:
# tagged" after it has created the release — which is this workflow's own job. A
# closed-PR event therefore never carries "tagged", so gating on it skipped every
# release (0.3.0 was merged and left untagged that way).
#
# workflow_dispatch exists for exactly that failure mode: a release PR merged while
# this workflow was skipped or failing stays labelled "pending", so a manual run
# picks it up and finishes the release.
#
# That manual run only works while the release commit is still the head of main.
# GitHub refuses to create a tag or a release on an older commit from GITHUB_TOKEN
# — measured, not guessed: a draft release on the release commit answers 403
# "Resource not accessible by integration" while the identical call against the
# head answers 201. Once other commits have landed on top, the release can no
# longer be produced by this workflow at all, which is what the `tag` input is
# for: create the tag and a draft release with a personal token, then run this
# workflow with that tag to build, sign, verify and publish into the draft.
on:
  pull_request:
    types:
      - closed
    branches:
      - main
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to build and publish. Leave empty for the normal flow; set it only to finish a release whose commit is no longer the head of main."
        required: false
        default: ""

concurrency:
  group: release-publish
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Tag Release
    # Skipped entirely when a tag is supplied: that path exists precisely because
    # Release Please cannot create the release any more.
    if: "${{ inputs.tag == '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.merged == true && contains(github.event.pull_request.labels.*.name, 'autorelease: pending'))) }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      release_sha: ${{ steps.release.outputs.sha }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
          # Only tag/create the release. Opening the next release PR is the job
          # of release-please.yml (workflow 1), recomputed after this release is
          # published, so its changelog is a delta rather than the whole history.
          skip-github-pull-request: true

  goreleaser:
    name: Build, Sign, and Publish Release
    needs: release
    # always() because the release job is skipped on the manual-tag path, and a
    # skipped dependency would otherwise skip this one too.
    if: "${{ always() && (needs.release.outputs.release_created == 'true' || inputs.tag != '') }}"
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Needed to move the release PR to "autorelease: published" once the
      # artifacts have verified, and to re-run the release-please workflow below.
      pull-requests: write
      actions: write
    env:
      # One name for both paths: the supplied tag, or the one Release Please made.
      TAG_NAME: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || needs.release.outputs.release_sha }}
          fetch-depth: 0

      - uses: actions/setup-go@b7ad1dad31e06c5925ef515d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      - name: Ensure release tag
        env:
          # Empty on the manual-tag path, where the tag is the checkout ref and
          # already exists — there is nothing to create and nothing to compare.
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
          MANUAL_TAG: ${{ inputs.tag }}
        run: |
          if [ -n "$MANUAL_TAG" ]; then
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
            test "$(git rev-list -n 1 "$TAG_NAME")" = "$(git rev-parse HEAD)"
            exit 0
          fi

          test "$(git rev-parse HEAD)" = "$RELEASE_SHA"

          remote_tag_sha="$(git ls-remote --refs origin "refs/tags/$TAG_NAME" | cut -f1)"
          if [ -n "$remote_tag_sha" ]; then
            test "$remote_tag_sha" = "$RELEASE_SHA"
            git fetch --force origin "refs/tags/$TAG_NAME:refs/tags/$TAG_NAME"
          else
            git tag "$TAG_NAME" "$RELEASE_SHA"
            git push origin "refs/tags/$TAG_NAME"
          fi

          test "$(git rev-list -n 1 "$TAG_NAME")" = "$RELEASE_SHA"

      - name: Import GPG key
        uses: crazy-max/ghaction-import-gpg@2dc316deee8e90f13e1a351ab510b4d5bc0c82cd # v7
        id: import_gpg
        with:
          gpg_private_key: ${{ secrets.GPG_PRIVATE_KEY }}
          passphrase: ${{ secrets.GPG_PASSPHRASE }}

      - name: Build and sign release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          version: v2.16.0
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GPG_FINGERPRINT: ${{ steps.import_gpg.outputs.fingerprint }}

      - name: Verify release artifacts
        run: |
          version=${TAG_NAME#v}
          ./scripts/verify-release-artifacts.sh dist "$version"
          gpg --batch --verify \
            "dist/terraform-provider-synology-dsm_${version}_SHA256SUMS.sig" \
            "dist/terraform-provider-synology-dsm_${version}_SHA256SUMS"

      - name: Publish verified draft release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "$TAG_NAME" --draft=false --latest

      # Release Please marks a release published itself — but only for releases it
      # publishes. This workflow deliberately keeps them as drafts until the
      # artifacts verify, so that step never runs and the release PR stays on
      # "autorelease: tagged".
      #
      # That label is how Release Please finds the previous release when it computes
      # the next one. Without it, the next release PR restates the whole history as
      # its changelog: 0.2.0 listed every commit back to the first, including
      # everything already shipped in 0.1.0 and 0.1.1.
      - name: Mark the release PR published
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RELEASE_SHA: ${{ needs.release.outputs.release_sha }}
        run: |
          if [ -n "$RELEASE_SHA" ]; then
            # The release commit is the squash-merge of the release PR, so the commit
            # resolves back to the PR that produced it.
            pr_number="$(gh api "repos/$REPO/commits/$RELEASE_SHA/pulls" --jq '.[0].number')"
          else
            # Manual-tag path: Release Please never ran, so there is no release sha
            # to resolve. The PR it would have relabelled is the merged one still
            # sitting on "autorelease: pending" — the same one it looks for itself.
            pr_number="$(gh api "repos/$REPO/pulls?state=closed&sort=updated&direction=desc&per_page=50" \
              --jq '[.[] | select(.merged_at != null) | select(any(.labels[]; .name == "autorelease: pending"))][0].number')"
          fi
          test -n "$pr_number"

          gh pr edit "$pr_number" \
            --add-label "autorelease: published" \
            --remove-label "autorelease: tagged" \
            --remove-label "autorelease: pending"

      # The previous release is now labelled "autorelease: published", so re-running
      # the release-please workflow computes the next release PR as a delta since
      # this release rather than re-stating the whole history.
      - name: Recompute release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run release-please.yml --ref main
